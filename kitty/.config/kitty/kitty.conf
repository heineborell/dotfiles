# include current-theme.conf
# include gruber.conf

enable_audio_bell no

font_size 30.0
text_composition_strategy legacy

#optional, flashes screen.
visual_bell_duration 0.5

# trails
cursor_trail 1

# open new tab with the present directory
map kitty_mod+enter launch --cwd=current --type=window
map cmd+enter       launch --cwd=current --type=window
map kitty_mod+t     launch --cwd=current --type=tab
map cmd+t           launch --cwd=current --type=tab

scrollback_pager nvim +"source ~/.config/kitty/vi-mode.lua"

# BEGIN_KITTY_FONTS
font_family      family="Iosevka Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# BEGIN_KITTY_THEME
# Rosé Pine
# include current-theme.conf
# END_KITTY_THEME
#
# tab bar 
tab_bar_style powerline

# Gruber Darker for Kitty
# -----------------------
# Theme author: John Gruber (https://daringfireball.net/projects/bbcolors/schemes/)
# Ported by: blazkowolf & vieitesss
# Upstream: https://github.com/blazkowolf/gruber-darker.nvim/blob/main/extras/kitty/gruber-darker.conf


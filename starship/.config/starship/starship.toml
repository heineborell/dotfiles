format = """
$directory\
$git_branch\
$git_status\
$fill\
$python\
$lua\
$nodejs\
$golang\
$haskell\
$rust\
$ruby\
$package\
$aws\
$docker_context\
$jobs\
$cmd_duration\
$line_break\
$character"""
#
#add_newline = true
palette = 'gruber-darker'
#

[git_branch]
style = 'fg:green'
symbol = ' '
format = '[on](white) [$symbol$branch ]($style)'

[fill]
symbol = ' '

[python]
symbol = ' '

[lua]
symbol = ' '

[nodejs]
style = 'blue'
symbol = ' '

[golang]
style = 'blue'
symbol = ' '

[haskell]
style = 'blue'
symbol = ' '

[rust]
style = 'orange'
symbol = ' '

[ruby]
style = 'blue'
symbol = ' '

[package]
symbol = '󰏗 '

[aws]
symbol = ' '
style = 'yellow'
format = '[$symbol($profile )(\[$duration\] )]($style)'

[docker_context]
symbol = ' '
style = 'fg:#06969A'
format = '[$symbol]($style) $path'
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['Dockerfile']

[jobs]
symbol = ' '
style = 'red'
number_threshold = 1
format = '[$symbol]($style)'

# -------------------------------
# Nord palette (your default now)
# -------------------------------
[palettes.nord]
dark_blue = '#5E81AC'
blue = '#9ccfd8'
teal = '#88C0D0'
red = '#BF616A'
orange = '#D08770'
green = '#31748f'
yellow = '#f6c177'
purple = '#B48EAD'
gray = '#434C5E'
black = '#2E3440'
white = '#D8DEE9'

# -------------------------------
# Real Gruber Darker palette
# -------------------------------
[palettes.gruber-darker]
black   = '#181818'
white   = '#E4E4E4'
gray    = '#52494E'   # medium gray (comments)
dark_blue = '#729FCF' # bright blue
blue    = '#96A6C8'   # softer blue
teal    = '#86B3B3'   # cyan/teal
red     = '#F43841'
orange  = '#FF8700'
green   = '#73D216'
yellow  = '#FFD700'
purple  = '#9E6FFE'
